[project]
name = "market-data"
version = "0.1.0"
description = "Local market data warehouse and backtesting toolkit backed by Tiingo, Parquet, and DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Meenan", email = "patmeenan@gmail.com" }]
dependencies = [
    "click>=8.1",
    "duckdb>=1.0",
    "exchange-calendars>=4.13,<5",
    "polars>=1.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.16,<0.17",
]

[project.scripts]
market-data = "marketdata.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.uv]
required-version = "==0.12.6"
