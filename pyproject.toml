[project]
name = "market-data"
version = "0.1.0"
description = "Local market data warehouse and backtesting toolkit backed by Tiingo, Parquet, and DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Patrick Meenan", email = "patmeenan@gmail.com" }]
dependencies = [
    "click>=8.1",
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
market-data = "marketdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
